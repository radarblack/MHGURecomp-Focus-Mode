name: Build FocusMode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows plugin
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc

      - name: Build and package Windows plugin
        shell: msys2 {0}
        run: make package-windows WINDOWS_CC=gcc

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FocusMode-Windows
          path: build/FocusMode-Windows-*.zip
          if-no-files-found: error
